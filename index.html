<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>Snake</h1>
        <div class="scoreboard">
          <span>Score: <strong id="score">0</strong></span>
          <button id="restartBtn" type="button">Restart</button>
        </div>
      </header>

      <p id="status" class="status">Use arrow keys or WASD to move.</p>
      <section id="board" class="board" aria-label="Snake game board"></section>

      <section class="controls" aria-label="Touch controls">
        <button data-dir="up" aria-label="Move up">↑</button>
        <div class="controls-row">
          <button data-dir="left" aria-label="Move left">←</button>
          <button data-dir="down" aria-label="Move down">↓</button>
          <button data-dir="right" aria-label="Move right">→</button>
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
