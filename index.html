<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>照片转卡通形象</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>现实照片 → 卡通形象</h1>
        <p>上传一张真人图片，一键生成卡通风格头像并下载。</p>
      </header>

      <section class="panel upload-panel">
        <label class="upload-label" for="imageInput">选择照片</label>
        <input id="imageInput" type="file" accept="image/*" />
        <p class="tip">建议使用光线充足、人物清晰的正面照片。</p>
      </section>

      <section class="panel controls-panel" aria-label="卡通参数">
        <div class="control">
          <label for="smoothnessRange">平滑强度</label>
          <input id="smoothnessRange" type="range" min="0" max="8" value="3" />
          <span id="smoothnessValue">3</span>
        </div>
        <div class="control">
          <label for="colorLevelsRange">色阶数量</label>
          <input id="colorLevelsRange" type="range" min="3" max="12" value="6" />
          <span id="colorLevelsValue">6</span>
        </div>
        <div class="control">
          <label for="edgeStrengthRange">线稿强度</label>
          <input id="edgeStrengthRange" type="range" min="8" max="60" value="28" />
          <span id="edgeStrengthValue">28</span>
        </div>
      </section>

      <section class="canvas-wrap" aria-label="效果预览">
        <canvas id="previewCanvas" width="720" height="720"></canvas>
      </section>

      <section class="actions">
        <button id="cartoonBtn" type="button">生成卡通</button>
        <button id="downloadBtn" type="button" disabled>下载图片</button>
      </section>

      <p id="status" class="status">请先上传一张照片。</p>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
